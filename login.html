<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Washy - Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

  <div class="login-container">
    <div class="logo">
      <img src="resources/assets/Logo Whashy.png" alt="Logo Whashy" width="100" height="100">
    </div>
    <h1>Willkommen bei Washy!</h1>
    <p class="subtitle">Dein Familien-Händewasch-Begleiter</p>
  </div>

      <form id="loginForm">
        <div class="input-group">
          <label>Familien-E-Mail</label>
          <input type="email" id="email" placeholder="deine-familie@email.com" required />
        </div>
        <div class="input-group">
          <label>Passwort</label>
          <input type="password" id="password" placeholder="••••••" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div class="footer">
        <a href="register.html" class="btn-secondary">Registrieren</a>
      </div>
    </div>

    <script src="js/login.js"></script>
    <script src="js/background.js"></script>
  </body>
</html>
