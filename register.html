<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Washy - Registrieren</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="logo">✨</div>
      <h1>Haushalt erstellen</h1>
      <p class="subtitle">Werde Teil der Washy-Familie</p>

      <form id="registerForm">
        <div class="input-group">
          <label>Familien-E-Mail</label>
          <input type="email" id="email" placeholder="name@beispiel.de" required />
        </div>
        <div class="input-group">
          <label>Passwort festlegen</label>
          <input type="password" id="password" placeholder="••••••" required />
        </div>
        <button type="submit" class="btn-primary">Konto erstellen</button>
      </form>

      <div class="footer">
        <p>Schon dabei? <a href="login.html" style="color: #74b9ff; text-decoration: none; font-weight: bold;">Jetzt einloggen</a></p>
      </div>
    </div>

    <script src="js/register.js"></script>
    <script src="js/background.js"></script>
  </body>
</html>
