<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Washy - Profil</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="logo">👤</div>
      <h1>Dein Profil</h1>
      <p class="subtitle">Personalisiere deine Daten</p>

      <form id="profilForm">
        <div class="input-group">
          <label>Vorname</label>
          <input type="text" id="vorname" placeholder="Dein Vorname" required />
        </div>
        <div class="input-group">
          <label>Nachname</label>
          <input type="text" id="nachname" placeholder="Dein Nachname" required />
        </div>
        <button type="submit" class="btn-primary">Änderungen speichern</button>
      </form>

      <div class="footer">
          <a href="dashboard.html" class="btn-secondary">Zurück zum Dashboard</a>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/profil.js"></script>
    <script src="js/background.js"></script>
  </body>
</html>
