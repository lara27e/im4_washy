<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washy - Registrieren</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
    
        <h1>Registrierung</h1>
        <p class="subtitle">Erstelle dein Konto und verbinde dein Gerät</p>
    
        <form id="registerForm">
            
            <h2>Persönliche Daten</h2>
    
            <div class="input-group">
                <label for="firstname">Vorname</label>
                <input type="text" name="firstname" id="firstname" placeholder="Max" required>
            </div>
    
            <div class="input-group">
                <label for="lastname">Nachname</label>
                <input type="text" name="lastname" id="lastname" placeholder="Mustermann" required>
            </div>
    
            <div class="input-group">
                <label for="email">E-Mail</label>
                <input type="email" name="email" id="email" placeholder="max@beispiel.de" required>
            </div>
    
            <div class="input-group">
                <label for="password">Passwort</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>
    
            <hr> <!-- Die Trennlinie nutzt nun auch die Abstände aus deinem CSS -->
    
            <h2>Sensor-Kopplung</h2>
    
            <div class="input-group">
                <label for="serial_number">Seriennummer</label>
                <input type="text" name="serial_number" id="serial_number" placeholder="SN-12345678" maxlength="16" required>
            </div>
    
            <button type="submit" class="btn-primary">Konto erstellen & Gerät koppeln</button>
            
            <p style="margin-top: 20px; font-size: 14px;">
                Schon dabei? <a href="login.php" class="link-text">Login</a>
            </p>
        </form>
    </div>

    <script src="js/background.js"></script> 
    <script src="js/register.js"></script>
</body>
</html>
